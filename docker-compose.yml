services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iris-api
    restart: unless-stopped
    ports:
      - "3030:3030"
    env_file:
      - .env
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3030}
    container_name: iris-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
